<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HB Creative | In-Housing</title>
  <meta name="description" content="">

  <!-- build:css -->
  <link rel="stylesheet" href="assets/dist/css/main.css">
  <!-- endbuild -->
</head>
<body>
<div class="hb-lp">

  <!-- ========== HEADER ========== -->
  <header class="hb-header">
    <div class="hb-container hb-header__inner">
      <a class="hb-header__logo" href="https://www.uk-hb.com/">
        <img src="assets/dist/images/logo.svg" alt="HB Creative" width="140" height="40">
      </a>
      <a class="hb-btn hb-btn--primary hb-js-scroll" href="#hb-form">Get in touch</a>
    </div>
  </header>

  <!-- ========== HERO ========== -->
  <section class="hb-hero">
    <div class="hb-container">
      <h1 class="hb-hero__title">Headline goes here</h1>
      <p class="hb-hero__intro">Supporting copy from the design.</p>
      <a class="hb-btn hb-btn--primary hb-js-scroll" href="#hb-form">Primary CTA</a>
    </div>
  </section>

  <!-- ========== CONTENT SECTIONS (built from Figma) ========== -->
  <section class="hb-section">
    <div class="hb-container">
      <h2>Section heading</h2>
      <p>Section content.</p>
    </div>
  </section>

  <!-- ========== FORM ========== -->
  <section class="hb-section hb-form-section" id="hb-form">
    <div class="hb-container hb-container--narrow">
      <h2>Form heading</h2>
      <!--
        HubSpot form: fill in data-portal-id and data-form-id (and data-region if not "eu1"/"na1").
        Find them in HubSpot > Marketing > Forms > [form] > Share > Embed code.
      -->
      <div class="hb-hsform"
           data-region="eu1"
           data-portal-id=""
           data-form-id="">
        <p class="hb-hsform__placeholder">HubSpot form loads here.</p>
      </div>
    </div>
  </section>

  <!-- ========== FOOTER ========== -->
  <footer class="hb-footer">
    <div class="hb-container">
      <p>&copy; <span class="hb-js-year"></span> HB Creative</p>
    </div>
  </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://js.hsforms.net/forms/embed/v2.js" charset="utf-8"></script>
<!-- build:js -->
<script src="assets/dist/js/main.js"></script>
<!-- endbuild -->
</body>
</html>
